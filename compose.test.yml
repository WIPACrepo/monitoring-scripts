# for local testing convenience only, not for deployment.
#
# usage:
#   docker compose -f compose.test.yml up --build
#   curl -s localhost:9100/metrics
#
# dry-run one pool at a time to keep the output readable, e.g.:
#   docker compose -f compose.test.yml run --rm status \
#     python3 condor_status_to_prometheus.py --dry-run \
#     --collector osg:cm-1.ospool.osg-htc.org \
#     --constraint 'osg:regexp("icecube",GLIDECLIENT_Group,"i")'

services:
  status:
    build: .
    ports:
      - "9100:9100"
    command:
      - python3
      - condor_status_to_prometheus.py
      - --collector
      - glidein:glidein-cm.icecube.wisc.edu
      - --collector
      - npx:cm-el9.icecube.wisc.edu
      # the two OSG pools partition the pool by allocation. only the dedicated half is
      # filtered, so osg-shared can still report the shared capacity we run on.
      - --collector
      - osg-dedicated:cm-1.ospool.osg-htc.org
      - --constraint
      - 'osg-dedicated:GLIDECLIENT_Group =?= undefined ? false : regexp("icecube",GLIDECLIENT_Group,"i")'
      - --collector
      - osg-shared:cm-1.ospool.osg-htc.org
      - --constraint
      - 'osg-shared:!(GLIDECLIENT_Group =?= undefined ? false : regexp("icecube",GLIDECLIENT_Group,"i"))'
      - --ours
      - 'osg-shared:icecube'
      # chtc is shared: unfiltered so shared capacity is visible, labelled by RemoteOwner
      - --collector
      - chtc:cm.chtc.wisc.edu
      - --ours
      - 'chtc:icecube'
      - -i
      - "60"
      - -p
      - "9100"
